# SPDX-License-Identifier: MIT
# Push a tag "vX.Y.Z" (matching the version in CMakeLists.txt) to build mchosectl for Linux and Windows and
# mchose-gui for Windows and Linux (AppImage), and publish a GitHub release with the notes of that version from CHANGELOG.md.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: ubuntu-22.04        # older glibc: the binary runs on most current distributions
            name: linux-x86_64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches the project version
        shell: bash
        run: |
          v=$(sed -n 's/^project(mchose-driver VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version v$v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Install build dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev ninja-build

      - name: Configure (static runtime, bundled hidapi)
        shell: bash
        run: |
          gen=""; [ "$RUNNER_OS" = Linux ] && gen="-G Ninja"
          cmake -S . -B build $gen -DCMAKE_BUILD_TYPE=Release -DMCHOSE_STATIC_RUNTIME=ON \
            -DCMAKE_DISABLE_FIND_PACKAGE_hidapi=ON -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package
        shell: bash
        run: |
          d=mchosectl-$VERSION-${{ matrix.name }}
          mkdir "$d"
          cp README.md LICENSE CHANGELOG.md "$d"/
          if [ "$RUNNER_OS" = Windows ]; then
            cp build/cli/Release/mchosectl.exe "$d"/
            7z a "$d.zip" "$d" > /dev/null
            echo "ASSET=$d.zip" >> "$GITHUB_ENV"
          else
            cp build/cli/mchosectl packaging/linux/70-mchose-hidraw.rules packaging/linux/72-mchose-uinput.rules packaging/linux/INSTALL.txt "$d"/
            strip "$d/mchosectl"
            tar czf "$d.tar.gz" "$d"
            echo "ASSET=$d.tar.gz" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}

  gui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches the project version
        shell: bash
        run: |
          v=$(sed -n 's/^project(mchose-driver VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version v$v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          arch: win64_msvc2022_64
          cache: true

      - name: Configure (GUI; dynamic runtime like Qt, bundled hidapi)
        run: cmake -S . -B build -DMCHOSE_BUILD_GUI=ON -DMCHOSE_BUILD_TESTS=OFF -DCMAKE_DISABLE_FIND_PACKAGE_hidapi=ON

      - name: Build
        run: cmake --build build --config Release --target mchose-gui

      - name: Package (windeployqt)
        shell: bash
        run: |
          d=mchose-gui-$VERSION-windows-x64
          mkdir "$d"
          cp build/gui/Release/mchose-gui.exe "$d"/
          windeployqt --release --qmldir gui/qml --no-translations --no-system-d3d-compiler --no-opengl-sw "$d/mchose-gui.exe"
          for f in msvcp140.dll msvcp140_1.dll msvcp140_2.dll vcruntime140.dll vcruntime140_1.dll; do
            cp "/c/Windows/System32/$f" "$d"/
          done
          cp gui/LICENSE "$d/LICENSE-GPL-3.0.txt"
          cp packaging/windows/README.txt packaging/windows/THIRD-PARTY.txt CHANGELOG.md "$d"/
          echo "PKG=$d" >> "$GITHUB_ENV"

      - name: Smoke test (the packaged app starts and renders offscreen)
        shell: bash
        run: |
          cp "$QT_ROOT_DIR/plugins/platforms/qoffscreen.dll" "$PKG/platforms/"
          QT_QPA_PLATFORM=offscreen timeout 120 "$PKG/mchose-gui.exe" --screenshot shot.png --tab 5
          rm "$PKG/platforms/qoffscreen.dll"
          test -s shot.png

      - name: Zip
        shell: bash
        run: |
          7z a "$PKG.zip" "$PKG" > /dev/null
          echo "ASSET=$PKG.zip" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v5
        with:
          name: gui-windows-x64
          path: ${{ env.ASSET }}

  gui-linux:
    runs-on: ubuntu-22.04        # older glibc: the AppImage runs on most current distributions
    steps:
      - uses: actions/checkout@v5

      - name: Check that the tag matches the project version
        run: |
          v=$(sed -n 's/^project(mchose-driver VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != version v$v"; exit 1; }
          echo "VERSION=$v" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libudev-dev libgl1-mesa-dev libegl1 libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libwayland-client0 libwayland-cursor0 libwayland-egl1

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true

      - name: Configure (bundled hidapi)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMCHOSE_BUILD_GUI=ON -DMCHOSE_BUILD_TESTS=OFF -DCMAKE_DISABLE_FIND_PACKAGE_hidapi=ON -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON

      - name: Build
        run: cmake --build build --target mchose-gui

      - name: AppImage
        run: QMAKE="$QT_ROOT_DIR/bin/qmake" packaging/linux/make-appimage.sh build "$VERSION" dist

      - name: Smoke test (starts and renders offscreen)
        run: |
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 timeout 120 "dist/mchose-gui-$VERSION-x86_64.AppImage" --screenshot shot.png --tab 6
          test -s shot.png

      - name: udev rules and install notes next to the AppImage
        run: |
          cp packaging/linux/70-mchose-hidraw.rules packaging/linux/72-mchose-uinput.rules packaging/linux/INSTALL.txt dist/

      - uses: actions/upload-artifact@v5
        with:
          name: gui-linux-x86_64
          path: dist/*

  publish:
    needs: [build, gui-windows, gui-linux]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true

      - name: Release notes from CHANGELOG.md
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '$0 ~ "^## "v"( |$)" {on=1; next} /^## / {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "no CHANGELOG entry for $v"; exit 1; }
          (cd dist && sha256sum * > SHA256SUMS.txt)

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "open-he-mchose driver $GITHUB_REF_NAME" --notes-file notes.md
