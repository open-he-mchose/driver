# SPDX-License-Identifier: MIT
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libhidapi-dev pkg-config ninja-build

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect binary
        shell: bash
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = Windows ]; then cp build/cli/Release/mchosectl.exe dist/; else cp build/cli/mchosectl dist/; fi

      - uses: actions/upload-artifact@v5
        with:
          name: mchosectl-${{ runner.os }}
          path: dist/

  gui:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libhidapi-dev pkg-config ninja-build libgl1-mesa-dev libxkbcommon-dev

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true

      - name: Configure
        shell: bash
        run: |
          gen=""; [ "$RUNNER_OS" = Linux ] && gen="-G Ninja"
          cmake -S . -B build $gen -DCMAKE_BUILD_TYPE=Release -DMCHOSE_BUILD_GUI=ON -DMCHOSE_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config Release --target mchose-gui

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure (core tests only, ASan + UBSan)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMCHOSE_BUILD_CLI=OFF -DMCHOSE_SANITIZE=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
