# SPDX-License-Identifier: MIT
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libhidapi-dev pkg-config ninja-build

      - name: Configure (Linux)
        if: runner.os == 'Linux'
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Collect binary
        shell: bash
        run: |
          mkdir dist
          if [ "$RUNNER_OS" = Windows ]; then cp build/cli/Release/mchosectl.exe dist/; else cp build/cli/mchosectl dist/; fi

      - uses: actions/upload-artifact@v5
        with:
          name: mchosectl-${{ runner.os }}
          path: dist/

  gui-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true
      - name: Configure
        run: cmake -S . -B build -DMCHOSE_BUILD_GUI=ON -DMCHOSE_BUILD_TESTS=OFF
      - name: Build
        run: cmake --build build --config Release --target mchose-gui mchosectl

  # Same steps as the release: AppImage, then an offscreen start of it.
  gui-linux-appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libudev-dev libgl1-mesa-dev libegl1 libxkbcommon-dev libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 \
            libxcb-shape0 libxcb-xinerama0 libxcb-xkb1 libwayland-client0 libwayland-cursor0 libwayland-egl1
      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: "6.8.3"
          cache: true
      - name: Configure (bundled hidapi)
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DMCHOSE_BUILD_GUI=ON -DMCHOSE_BUILD_TESTS=OFF -DCMAKE_DISABLE_FIND_PACKAGE_hidapi=ON -DCMAKE_DISABLE_FIND_PACKAGE_PkgConfig=ON
      - name: Build
        run: cmake --build build --target mchose-gui
      - name: AppImage
        run: QMAKE="$QT_ROOT_DIR/bin/qmake" packaging/linux/make-appimage.sh build ci dist
      - name: Smoke test (starts and renders offscreen)
        run: |
          QT_QPA_PLATFORM=offscreen APPIMAGE_EXTRACT_AND_RUN=1 timeout 120 dist/mchose-gui-ci-x86_64.AppImage --screenshot shot.png --tab 6
          test -s shot.png
      - uses: actions/upload-artifact@v5
        with:
          name: mchose-gui-appimage
          path: |
            dist/*.AppImage
            shot.png

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Configure (core tests only, ASan + UBSan)
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DMCHOSE_BUILD_CLI=OFF -DMCHOSE_SANITIZE=ON
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure
